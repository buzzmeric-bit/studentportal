name: student_portal
description: A modern student portal application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Supabase
  supabase_flutter: ^2.3.4
  
  # Routing
  go_router: ^12.1.3
  
  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  fl_chart: ^0.65.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.0.9
  
  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  url_launcher: ^6.2.4
  path_provider: ^2.1.2
  
  # PDF & Documents
  flutter_pdfview: ^1.3.2
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/pythaonelogo.png
